<div class="{% if field.name == 'address' or field.name == 'sustainability_goal' %}col-12{% else %}col-12 col-md-6{% endif %}">
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}</label>
  {% if field.name == "reports_esg" %}
    <div class="d-flex flex-wrap gap-4 pt-1" role="radiogroup" aria-label="{{ field.label }}">
      {% for option in field %}<div class="form-check">{{ option.tag }}<label class="form-check-label" for="{{ option.id_for_label }}">{{ option.choice_label }}</label></div>{% endfor %}
    </div>
  {% else %}
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
</div>
