{% if is_paginated %}
<nav aria-label="Pagination"><ul class="pagination">
  {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.previous_page_number }}">Précédent</a></li>{% endif %}
  <li class="page-item active" aria-current="page"><span class="page-link">Page {{ page_obj.number }} / {{ paginator.num_pages }}</span></li>
  {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.next_page_number }}">Suivant</a></li>{% endif %}
</ul></nav>
{% endif %}
