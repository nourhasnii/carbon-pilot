<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Page introuvable — CarbonPilot</title>
<style>
:root{--bg:#EEF2F3;--fg:#0F2A2E;--soft:#3C5558;--link:#0B6B66;--btn:#0B6B66;--panel:#fff;--rule:#CBD6D8}
@media (prefers-color-scheme: dark){:root{--bg:#0A1719;--fg:#E6F0EF;--soft:#A9C2C0;--link:#5CCBC2;--btn:#0E7A74;--panel:#112428;--rule:#284246}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
main{max-width:34rem;margin:1.5rem;padding:2rem;background:var(--panel);border:1px solid var(--rule);border-radius:6px;border-left:4px solid #B45309}
.code{font-size:.95rem;color:var(--soft);margin:0 0 .5rem}
h1{font-family:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;font-size:2rem;line-height:1.1;margin:0 0 1rem}
p{margin:0 0 1rem}.soft{color:var(--soft)}
a.btn{display:inline-block;background:var(--btn);color:#fff;text-decoration:none;font-weight:600;padding:.6rem 1.2rem;border-radius:4px}
a:focus-visible{outline:3px solid #FFBF47;outline-offset:2px}
</style></head>
<body><main><p class="code">Erreur 404</p><h1>Page introuvable</h1><p>La page demandée n'existe pas ou n'est pas accessible avec votre compte.</p><p class="soft">Vérifiez l'adresse, ou revenez à l'accueil.</p><a class="btn" href="/">Retour à l'accueil</a></main></body></html>
