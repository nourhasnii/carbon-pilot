{% comment %}Filter toolbar. Expects `filter_form` and `reset_url`.{% endcomment %}
<form class="cp-toolbar" method="get" role="search">
  <div class="cp-field">
    <label for="{{ filter_form.year.id_for_label }}">Year</label>
    {{ filter_form.year }}
  </div>
  <div class="cp-field">
    <label for="{{ filter_form.scope.id_for_label }}">Scope</label>
    {{ filter_form.scope }}
  </div>
  <div class="cp-field">
    <label for="{{ filter_form.category.id_for_label }}">Category</label>
    {{ filter_form.category }}
  </div>
  <div class="cp-field">
    <label for="{{ filter_form.department.id_for_label }}">Department</label>
    {{ filter_form.department }}
  </div>
  {% if filter_form.status %}
    <div class="cp-field">
      <label for="{{ filter_form.status.id_for_label }}">Status</label>
      {{ filter_form.status }}
    </div>
  {% endif %}
  <div class="cp-row">
    <button class="cp-btn cp-btn-primary" type="submit"><i data-lucide="filter"></i> Apply</button>
    <a class="cp-btn cp-btn-ghost" href="{{ reset_url }}">Reset</a>
  </div>
</form>
