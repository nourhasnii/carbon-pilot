<div class="cp-field {% if field.name == 'description' or field.name == 'assumptions' %}cp-span-2{% endif %}">
  <label for="{{ field.id_for_label }}">
    {{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}
  </label>
  <p class="cp-hint" id="{{ field.name }}-help">{{ field.help_text }}</p>
  {{ field }}
  {% if field.errors %}
    <span class="cp-error" id="{{ field.name }}-error" role="alert">
      {{ field.errors|striptags }}
    </span>
  {% else %}
    <span class="cp-error" id="{{ field.name }}-error" role="alert" hidden></span>
  {% endif %}
</div>
